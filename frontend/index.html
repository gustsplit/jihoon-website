<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jihoon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <div class="brick-row" aria-hidden="true">
      <div class="brick red"><span></span><span></span><span></span><span></span></div>
      <div class="brick yellow"><span></span><span></span><span></span><span></span></div>
      <div class="brick blue"><span></span><span></span><span></span><span></span></div>
      <div class="brick green"><span></span><span></span><span></span><span></span></div>
    </div>

    <header class="hero">
      <h1 id="site-title">Jihoon</h1>
      <p id="site-welcome" class="welcome"></p>
    </header>

    <section id="cards" class="cards"></section>
  </main>

  <footer class="footer">
    <p>Built brick by brick &middot; <span id="year"></span></p>
  </footer>

  <!-- Load order: back-end, then interface, then front-end. -->
  <script src="../backend/content.js"></script>
  <script src="../interface/api.js"></script>
  <script src="app.js"></script>
</body>
</html>
